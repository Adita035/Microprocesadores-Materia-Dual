<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Club Deportivo - Membresias</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/favicon.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="publicPage">
    <header class="publicTopbar">
        <a class="brand" href="/" aria-label="Club Deportivo">
            <span class="brandMark logoMark"></span>
            <span>
                <strong>Club Deportivo</strong>
                <small>Membresias</small>
            </span>
        </a>

        <nav class="publicNav">
            <a href="/">Inicio</a>
            <a href="/#actividades-publicas">Actividades</a>
            <a class="button ghost" href="/#membresias">Planes</a>
        </nav>
    </header>

    <main class="publicShell">
        <section class="membershipHero">
            <div>
                <p class="eyebrow">Membresias</p>
                <h1>Selecciona el plan que se ajusta a tu ritmo.</h1>
                <p class="heroCopy">Compara beneficios, duracion y acceso antes de continuar con tu registro dentro del club.</p>
            </div>
        </section>

        <section class="section">
            <div class="sectionHeader">
                <div>
                    <p class="eyebrow">Comparador</p>
                    <h2>Planes disponibles</h2>
                </div>
                <span id="membershipSessionStatus" class="pill">Seleccion con cuenta activa</span>
            </div>
            <div id="currentMembership" class="currentMembership hidden"></div>
            <div id="membershipPlans" class="membershipPlans">
                <article class="emptyState">Cargando membresias...</article>
            </div>
        </section>
    </main>

    <pre id="toast" class="publicToast hidden"></pre>
    <script src="/membresias/membresias.js"></script>
</body>
</html>
